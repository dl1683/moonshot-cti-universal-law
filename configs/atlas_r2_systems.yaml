baselines:
  - id: "regex_baseline"
    description: "Regex/rule-based pattern matcher for W-D2/W-D3"
  - id: "bm25_baseline"
    description: "BM25 retrieval + template for W-D2"
  - id: "random_baseline"
    description: "Random feasible answer for floor calibration"

gate_a:
  input_count: 9
  output_count: 6
  rule: "2 per family: highest quality + cheapest within 10pt of family best"

gate_b:
  input_count_max: 32
  output_count: 4
  ranking: ["floors_passed", "worst_shortfall", "cost_10k", "peak_memory", "system_id"]
  constraints:
    min_families: 2
    min_sub_1_7b: 1

quantization_audit:
  format: "W8A16"
  scope: "4 finalists only"
  purpose: "audit, not selector candidate"
